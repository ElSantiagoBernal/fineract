name: Fineract to ECR

on:
  push:
    branches: [develop]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker image
        run: |
          docker build -t fineract .
          docker tag fineract:latest $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:latest

  # Deploy on EC2
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH key length
        run: echo "${{ secrets.EC2_SSH_KEY }}" | wc -c

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR on EC2
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_REGION }}.amazonaws.com
            
            # Stop and remove existing container if running
            docker stop fineract || true
            docker rm fineract || true

            # Pull latest image
            docker pull ${{ env.ECR_REPOSITORY }}:latest

            # Run new container (customize según tu configuración)
            docker run -d --restart always -p 8443:8443 --name fineract ${{ env.ECR_REPOSITORY }}:latest
